name: Create GitHub Release
on:
  push:
    tags:
      - 'v*' # Triggers on v1.0, v2.1.3, etc.

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Prepare Release Keystore
        run: |
          update_config() {
              local key=$1
              local value=$2
              local file=$3

              if grep -q "^$key=" "$file"; then
                  sed -i "s|^$key=.*|$key=\"$value\"|g" "$file"
              else
                  echo "$key=\"$value\"" >> "$file"
              fi

              if grep -q "^$key=\"$value\"" "$file"; then
                  echo "Successfully set $key"
              else
                  echo "FAILED to set $key"
                  exit 1
              fi
          }

          update_config "keystore/release" "res://release.keystore" export_presets.cfg
          update_config "keystore/release_user" "${{ secrets.ANDROID_KEY_ALIAS }}" export_presets.cfg
          update_config "keystore/release_password" "${{ secrets.ANDROID_KEY_PASSWORD }}" export_presets.cfg
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > release.keystore

          echo "--- Config Verification ---"
          grep "keystore/release" export_presets.cfg | sed 's/password=".*"/password="***"/' | sed 's/release_user=".*"/release_user="***"/'

      - name: Export Godot Project
        uses: ./.github/actions/godot-android-export
        with:
          godot-version: 4.6.1
          godot-channel: stable
          export-type: release

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: ./*.apk
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Discord notification
        uses: rjstone/discord-webhook-notify@v1
        if: success()
        with:
          severity: info
          details: |
            @everyone New Release: ${{ github.ref_name }} is now available!
            🔗 View Release: ${{ steps.create_release.outputs.url }}
          webhookUrl: ${{ secrets.DISCORD_RELEASE_CHANNEL_WEBHOOK }}
          avatarUrl: https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png